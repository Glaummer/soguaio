<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOGUAIO - Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-container { max-width: 600px; width: 100%; margin: 20px auto; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; height: 85vh; }
        .chat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; background: #fff; padding: 3px; }
        .chat-header h2 { color: #f0c040; font-size: 1.2rem; }
        .chat-mensagens { flex: 1; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; gap: 10px; }
        .mensagem { padding: 12px 16px; border-radius: 15px; max-width: 85%; word-wrap: break-word; font-size: 0.95rem; }
        .usuario { background: #f0c040; color: #1a1a2e; align-self: flex-end; }
        .soguaio { background: rgba(255,255,255,0.1); color: #fff; align-self: flex-start; }
        .chat-input { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .chat-input input { flex: 1; padding: 12px 16px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 1rem; outline: none; }
        .chat-input button { background: #f0c040; color: #1a1a2e; border: none; padding: 12px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .voltar { color: #aaa; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="{{ url_for('static', filename='logotipo.png') }}" alt="SOGUAIO">
            <h2>SOGUAIO</h2>
            <a href="/" class="voltar" style="margin-left: auto;">← Sair</a>
        </div>
        <div class="chat-mensagens" id="mensagens">
            <div class="mensagem soguaio">Olá! Sou o SOGUAIO. Como posso ajudar com a sua obra de arte?</div>
        </div>
        <form class="chat-input" onsubmit="enviarMensagem(event)">
            <input type="text" id="pergunta" placeholder="Digite a sua mensagem..." autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
    </div>
    <script>
        async function enviarMensagem(event) {
            event.preventDefault();
            const input = document.getElementById('pergunta');
            const pergunta = input.value.trim();
            if (!pergunta) return;
            const mensagens = document.getElementById('mensagens');
            const msgUser = document.createElement('div');
            msgUser.className = 'mensagem usuario';
            msgUser.textContent = pergunta;
            mensagens.appendChild(msgUser);
            input.value = '';
            mensagens.scrollTop = mensagens.scrollHeight;
            const msgProcess = document.createElement('div');
            msgProcess.className = 'mensagem soguaio';
            msgProcess.textContent = 'A processar...';
            mensagens.appendChild(msgProcess);
            mensagens.scrollTop = mensagens.scrollHeight;
            try {
                const resposta = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pergunta: pergunta})
                });
                const dados = await resposta.json();
                msgProcess.textContent = dados.resposta;
                mensagens.scrollTop = mensagens.scrollHeight;
            } catch (erro) {
                msgProcess.textContent = 'Erro: ' + erro;
            }
        }
    </script>
</body>
</html>
